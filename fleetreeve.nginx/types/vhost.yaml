# Used as:
#   - fleetreeve.nginx.vhost: www
#     server_name: www.example.com
#     root: /usr/share/nginx/html/www
#     port: 8080
#
# Needs the module's main role (it refers to the package and the
# configuration check from there).
description: An nginx virtual host - web root, start page and server block.
params:
  server_name: {required: true, description: "The host name the site answers to."}
  root: {required: true, description: "Its web root. Below the packaged /usr/share/nginx/html it inherits an SELinux type nginx may read."}
  port: {type: int, default: 80, description: "The port to listen on."}

resources:
  # Owned by root and only readable by nginx: a process that serves the
  # site should not be able to rewrite it.
  - file: "{{ .root }}"
    ensure: directory
    owner: root
    mode: 0755
    require: package[nginx]         # the package creates the parent

  - file: "{{ .root }}/index.html"
    content: |
      <!doctype html>
      <title>{{ .server_name }}</title>
      <h1>{{ .server_name }}</h1>
      <p>Served by {{ .host.name }}.</p>

  # Written, then checked as part of the whole configuration, and put back
  # if that check fails.
  - file: "/etc/nginx/conf.d/{{ .title }}.conf"
    template: ../templates/vhost.conf.tmpl
    mode: 0644
    rollback: true
    require: package[nginx]
    notify: exec[check nginx configuration]
